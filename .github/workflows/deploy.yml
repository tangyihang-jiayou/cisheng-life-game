name: Deploy life simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Verify comic data, simulator, and frontend syntax
        run: |
          node engine/verify-comic.cjs
          node engine/verify-sharp.cjs
          node engine/verify-art.cjs
          node engine/verify-readings.cjs
          node engine/verify-explanations.cjs
          node engine/verify-simulator.cjs
          node --check dist/app.js
          node --check dist/archive.js
          for source in dist/*.js; do
            node --check "$source"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
